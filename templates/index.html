<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSC 423 | Real-Time TCP Chat Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-surface: #111827;
      --bg-panel: #1e293b;
      --bg-hover: #334155;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }

    #loginOverlay {
      position: fixed; inset: 0; background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .login-card {
      background: var(--bg-surface); border: 1px solid var(--border-color);
      padding: 2.5rem 2rem; border-radius: 16px; width: 90%; max-width: 380px; text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .login-card h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .login-card p { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .login-card input {
      width: 100%; padding: 0.85rem 1rem; background: var(--bg-panel); border: 1px solid var(--border-color);
      border-radius: 10px; color: #fff; font-size: 0.95rem; margin-bottom: 1rem; outline: none;
    }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button {
      width: 100%; padding: 0.85rem; background: var(--accent-gradient); border: none; border-radius: 10px;
      color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }

    .app-container {
      width: 100%; max-width: 1020px; height: 88vh; background: var(--bg-surface);
      border: 1px solid var(--border-color); border-radius: 20px; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }

    .chat-header {
      padding: 1rem 1.5rem; background: rgba(17, 24, 39, 0.9);
      border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
    }
    .brand-title { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo {
      width: 36px; height: 36px; background: var(--accent-gradient);
      border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .status-badge {
      display: flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; font-weight: 600;
      padding: 0.35rem 0.75rem; border-radius: 999px;
    }
    .status-badge.live { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-badge.offline { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .chat-body { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar Channels & Direct Messages */
    .chat-sidebar {
      width: 250px; background: rgba(15, 23, 42, 0.6); border-right: 1px solid var(--border-color);
      padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 1.2rem;
    }
    .sidebar-section-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 700; margin-bottom: 0.4rem;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
    .nav-item {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.75rem;
      border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: background 0.15s;
    }
    .nav-item:hover { background: rgba(255, 255, 255, 0.05); }
    .nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }
    .nav-item.active .avatar { background: #fff; color: var(--accent); }

    .avatar {
      width: 26px; height: 26px; border-radius: 50%; background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700;
    }

    /* Main Chat Section */
    .chat-main { flex: 1; display: flex; flex-direction: column; background: #0c121e; position: relative; }
    .current-chat-banner {
      padding: 0.75rem 1.5rem; background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted);
    }
    .current-chat-banner strong { color: var(--text-main); }

    .messages-viewport {
      flex: 1; padding: 1.25rem 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.9rem;
    }

    .message-row { display: flex; gap: 0.75rem; max-width: 75%; }
    .message-row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .message-row.other { align-self: flex-start; }
    .bubble-wrapper { display: flex; flex-direction: column; gap: 0.25rem; }
    .message-row.mine .bubble-wrapper { align-items: flex-end; }
    .msg-sender { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
    .bubble {
      padding: 0.7rem 0.95rem; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; word-break: break-word;
    }
    .message-row.mine .bubble { background: var(--accent-gradient); color: #fff; border-bottom-right-radius: 3px; }
    .message-row.other .bubble { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); border-bottom-left-radius: 3px; }
    .bubble-gif { border-radius: 12px; overflow: hidden; max-width: 240px; border: 1px solid var(--border-color); }
    .bubble-gif img { width: 100%; height: auto; display: block; }
    .msg-timestamp { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin: 0 0.2rem; }

    .system-notice {
      align-self: center; background: rgba(255,255,255,0.04); padding: 0.25rem 0.75rem;
      border-radius: 999px; font-size: 0.72rem; color: var(--text-muted); font-style: italic;
    }

    /* Typing Bar */
    .typing-bar {
      min-height: 20px; padding: 0 1.5rem 0.3rem; font-size: 0.74rem;
      color: var(--accent); font-style: italic;
    }

    .quick-emoji-tray {
      display: flex; gap: 0.4rem; padding: 0.35rem 1.25rem; background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
    }
    .emoji-chip { background: transparent; border: none; cursor: pointer; font-size: 1.15rem; padding: 0.2rem; }
    .emoji-chip:hover { transform: scale(1.2); }

    .composer-dock {
      padding: 0.75rem 1.25rem 1rem; background: var(--bg-surface); display: flex; gap: 0.6rem; align-items: center;
    }
    .action-btn {
      background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-muted);
      width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem;
    }
    .action-btn:hover { background: var(--bg-hover); color: #fff; }
    .input-field {
      flex: 1; padding: 0.75rem 1rem; background: var(--bg-panel); border: 1px solid var(--border-color);
      border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none;
    }
    .send-btn {
      padding: 0 1.25rem; height: 40px; background: var(--accent-gradient); border: none;
      border-radius: 10px; color: #fff; font-weight: 600; font-size: 0.88rem; cursor: pointer;
    }

    /* Popovers */
    .popover-box {
      position: absolute; bottom: 80px; left: 1.5rem; background: var(--bg-surface);
      border: 1px solid var(--border-color); border-radius: 14px; padding: 1rem; width: 320px;
      display: none; z-index: 20; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .popover-box.open { display: block; }
    .popover-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .gif-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; max-height: 200px; overflow-y: auto; }
    .gif-item { cursor: pointer; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; background: var(--bg-panel); }
    .gif-item img { width: 100%; height: 100%; object-fit: cover; }
    .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.3rem; max-height: 180px; overflow-y: auto; text-align: center; }
    .emoji-cell { cursor: pointer; font-size: 1.2rem; padding: 0.25rem; border-radius: 6px; }
    .emoji-cell:hover { background: var(--bg-hover); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }
  </style>
</head>
<body>

  <div id="loginOverlay">
    <div class="login-card">
      <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">⚡</div>
      <h2>CSC 423 Live Chat</h2>
      <p>Enter your username to establish a TCP WebSocket connection.</p>
      <input type="text" id="usernameInput" placeholder="Username (e.g. Jason)..." autocomplete="off" />
      <button onclick="joinChat()">Connect to Server</button>
    </div>
  </div>

  <div class="app-container">
    <header class="chat-header">
      <div class="brand-title">
        <div class="brand-logo">WS</div>
        <div>
          <h3 style="font-size: 0.95rem;">CSC 423 Socket Hub</h3>
          <span style="font-size: 0.72rem; color: var(--text-muted);">TCP Full-Duplex Broadcast Engine</span>
        </div>
      </div>
      <div id="statusBadge" class="status-badge offline">
        <div class="status-dot"></div>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <div class="chat-body">
      <!-- Sidebar Navigation: Channels & 1-on-1 DMs -->
      <aside class="chat-sidebar">
        <div>
          <div class="sidebar-section-title">Rooms</div>
          <ul class="nav-list">
            <li id="room-all" class="nav-item active" onclick="switchChannel('all', 'Group Chat')">
              <div class="avatar">#</div>
              <span>Group Chat</span>
            </li>
          </ul>
        </div>

        <div style="flex: 1; overflow-y: auto;">
          <div class="sidebar-section-title">Direct Messages (<span id="userCount">0</span>)</div>
          <ul id="userList" class="nav-list"></ul>
        </div>
      </aside>

      <!-- Main Messages Stream -->
      <section class="chat-main">
        <div class="current-chat-banner">
          Active Conversation: <strong id="channelNameDisplay">Group Chat</strong>
        </div>

        <div id="messagesViewport" class="messages-viewport"></div>

        <!-- Typing Indicator Area -->
        <div id="typingIndicator" class="typing-bar"></div>

        <!-- GIF Flyout -->
        <div id="gifPopover" class="popover-box">
          <div class="popover-header">
            <h4 style="font-size: 0.85rem;">Select a GIF</h4>
            <button onclick="toggleGifPicker(false)" style="background:none;border:none;color:#fff;cursor:pointer;">✕</button>
          </div>
          <div class="gif-grid" id="gifGrid"></div>
        </div>

        <!-- Emoji Flyout -->
        <div id="emojiPopover" class="popover-box">
          <div class="popover-header">
            <h4 style="font-size: 0.85rem;">Pick an Emoji</h4>
            <button onclick="toggleEmojiPicker(false)" style="background:none;border:none;color:#fff;cursor:pointer;">✕</button>
          </div>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <!-- Quick Emoji Strip -->
        <div class="quick-emoji-tray">
          <button class="emoji-chip" onclick="insertEmoji('🔥')">🔥</button>
          <button class="emoji-chip" onclick="insertEmoji('🚀')">🚀</button>
          <button class="emoji-chip" onclick="insertEmoji('😂')">😂</button>
          <button class="emoji-chip" onclick="insertEmoji('❤️')">❤️</button>
          <button class="emoji-chip" onclick="insertEmoji('👏')">👏</button>
          <button class="emoji-chip" onclick="insertEmoji('👀')">👀</button>
        </div>

        <!-- Input Dock -->
        <form id="composerForm" class="composer-dock">
          <button type="button" class="action-btn" title="Pick an Emoji" onclick="toggleEmojiPicker()">😊</button>
          <button type="button" class="action-btn" title="Send a GIF" onclick="toggleGifPicker()">GIF</button>
          <input type="text" id="messageInput" class="input-field" placeholder="Type a message..." autocomplete="off" oninput="handleTyping()" required />
          <button type="submit" class="send-btn">Send</button>
        </form>
      </section>
    </div>
  </div>

  <script>
    let socket = null;
    let myUsername = "";
    let currentTarget = "all"; // 'all' for group, or specific username for 1-to-1
    let typingTimeout = null;

    // In-memory conversation stores: { "all": [...], "Username": [...] }
    const messageHistory = { "all": [] };

    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const chat = document.getElementById("messagesViewport");
    const userListEl = document.getElementById("userList");
    const userCountEl = document.getElementById("userCount");
    const channelNameDisplay = document.getElementById("channelNameDisplay");
    const typingIndicator = document.getElementById("typingIndicator");
    const form = document.getElementById("composerForm");
    const messageInput = document.getElementById("messageInput");
    const gifPopover = document.getElementById("gifPopover");
    const emojiPopover = document.getElementById("emojiPopover");

    const defaultGifs = [
      "https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif",
      "https://media.giphy.com/media/26AHONQ79FdWZhAI0/giphy.gif",
      "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
      "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif",
      "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
      "https://media.giphy.com/media/d3mlE7uhX8KFgEmY/giphy.gif"
    ];

    const defaultEmojis = [
      "😀","😂","🤣","😍","😎","🥳","🤩","🤔","🤫","🤯","🥶","😱",
      "🔥","✨","🎉","💯","🚀","⚡","👍","👎","👏","🙌","🤝","🙏"
    ];

    // Populate GIF & Emoji pickers
    const gifGrid = document.getElementById("gifGrid");
    defaultGifs.forEach(url => {
      const div = document.createElement("div");
      div.className = "gif-item";
      div.innerHTML = `<img src="${url}" loading="lazy"/>`;
      div.onclick = () => sendMedia("gif", url);
      gifGrid.appendChild(div);
    });

    const emojiGrid = document.getElementById("emojiGrid");
    defaultEmojis.forEach(em => {
      const span = document.createElement("div");
      span.className = "emoji-cell";
      span.textContent = em;
      span.onclick = () => { insertEmoji(em); toggleEmojiPicker(false); };
      emojiGrid.appendChild(span);
    });

    function toggleGifPicker(force) {
      emojiPopover.classList.remove("open");
      gifPopover.classList.toggle("open", typeof force === "boolean" ? force : undefined);
    }

    function toggleEmojiPicker(force) {
      gifPopover.classList.remove("open");
      emojiPopover.classList.toggle("open", typeof force === "boolean" ? force : undefined);
    }

    function insertEmoji(em) {
      messageInput.value += em;
      messageInput.focus();
    }

    function switchChannel(targetId, displayName) {
      currentTarget = targetId;
      channelNameDisplay.textContent = targetId === "all" ? "Group Chat" : `Private DM with @${targetId}`;

      // Update active highlight in sidebar
      document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
      const activeEl = targetId === "all" ? document.getElementById("room-all") : document.getElementById(`user-${targetId}`); if (activeEl) activeEl.classList.add("active");  // Re-render chat stream from memory chat.innerHTML = ""; if (!messageHistory[currentTarget]) messageHistory[currentTarget] = []; messageHistory[currentTarget].forEach(payload => appendMessageDOM(payload)); typingIndicator.textContent = ""; }  function handleTyping() { if (!socket \vert{}\vert{} socket.readyState !== WebSocket.OPEN) return; socket.send(JSON.stringify({ type: "typing", target: currentTarget })); }  function joinChat() { const name = document.getElementById("usernameInput").value.trim(); if (!name) return; myUsername = name; document.getElementById("loginOverlay").style.display = "none";  const protocol = window.location.protocol === "https:" ? "wss://" : "ws://"; const wsUrl = `${protocol}${window.location.host}/ws/${encodeURIComponent(myUsername)}`;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        statusBadge.className = "status-badge live";
        statusText.textContent = "Live Socket";
      };

      socket.onclose = () => {
        statusBadge.className = "status-badge offline";
        statusText.textContent = "Offline";
      };

      socket.onmessage = (event) => {
        const payload = JSON.parse(event.data);

        // 1. User Presence List Update
        if (payload.type === "userlist") {
          userListEl.innerHTML = "";
          const otherUsers = payload.users.filter(u => u !== myUsername);
          userCountEl.textContent = otherUsers.length;

          otherUsers.forEach(u => {
            const li = document.createElement("li");
            li.id = `user-${u}`; li.className = `nav-item ${currentTarget === u ? 'active' : ''}`;
            li.onclick = () => switchChannel(u, u);
            li.innerHTML = `
              <div class="avatar">${u.substring(0, 2).toUpperCase()}</div>
              <span>${u}</span>
            `;
            userListEl.appendChild(li);
          });
          return;
        }

        // 2. Typing Notification Event
        if (payload.type === "typing") {
          // If in group chat and typing target is group, or in DM with this sender
          if ((currentTarget === "all" && payload.target === "all") || (currentTarget === payload.sender && payload.target === myUsername)) {
            typingIndicator.textContent = `${payload.sender} is typing...`;
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { typingIndicator.textContent = ""; }, 2000);
          }
          return;
        }

        // 3. Chat / System Message Event
        const storageKey = payload.target === "all" ? "all" : (payload.sender === myUsername ? payload.target : payload.sender);
        if (!messageHistory[storageKey]) messageHistory[storageKey] = [];
        messageHistory[storageKey].push(payload);

        // If the message belongs to current active view, render it
        if (storageKey === currentTarget) {
          appendMessageDOM(payload);
        }
      };
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      const val = messageInput.value.trim();
      if (!val || !socket || socket.readyState !== WebSocket.OPEN) return;

      socket.send(JSON.stringify({
        type: "message",
        target: currentTarget,
        kind: "text",
        content: val
      }));
      messageInput.value = "";
    };

    function sendMedia(kind, url) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        type: "message",
        target: currentTarget,
        kind: kind,
        content: url
      }));
      toggleGifPicker(false);
    }

    function appendMessageDOM(payload) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (payload.type === "system") {
        const sys = document.createElement("div");
        sys.className = "system-notice";
        sys.textContent = payload.text;
        chat.appendChild(sys);
      } else {
        const isMine = payload.sender === myUsername;
        const row = document.createElement("div");
        row.className = `message-row ${isMine ? 'mine' : 'other'}`;

        let bodyContent = "";
        if (payload.kind === "gif") {
          bodyContent = `<div class="bubble-gif"><img src="${payload.content}" alt="Shared GIF"/></div>`;
        } else {
          bodyContent = `<div class="bubble">${escapeHtml(payload.content)}</div>`;
        }

        row.innerHTML = `
          <div class="avatar">${payload.sender.substring(0, 2).toUpperCase()}</div>
          <div class="bubble-wrapper">
            ${!isMine ? `<span class="msg-sender">${escapeHtml(payload.sender)}</span>` :
